# Include these locations inside the existing AI assistant server block.
# Keep the API port consistent with SERVER_PORT in the server's .env.
        location ~ ^/sso/login/?$ {
            access_log off;
            error_log logs/error.log crit;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files /index.html =404;
        }

        location = /api/sso/login {
            access_log off;
            error_log logs/error.log crit;
            error_page 500 502 503 504 = @sso_unavailable;
            proxy_pass http://127.0.0.1:4178;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @sso_unavailable {
            access_log off;
            error_log logs/error.log crit;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            return 502 '{"code":"SSO_PROXY_UNAVAILABLE"}';
        }
